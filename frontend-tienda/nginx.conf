server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas de Angular (evita 404 al recargar /carrito, /perfil, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia los 8 microservicios dentro de la red Docker (red-tienda)
    location /api/usuarios {
        proxy_pass http://api-usuarios:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/productos {
        proxy_pass http://api-productos:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/envios {
        proxy_pass http://api-envios:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/inventario {
        proxy_pass http://api-inventario:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/carrito {
        proxy_pass http://api-carrito:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/pedidos {
        proxy_pass http://api-pedidos:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/pagos {
        proxy_pass http://api-pagos:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/resenas {
        proxy_pass http://api-resenas:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}