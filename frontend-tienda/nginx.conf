server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver kube-dns.kube-system.svc.cluster.local 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/usuarios {
        set $upstream_usuarios http://api-usuarios:3001;
        proxy_pass $upstream_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/productos {
        set $upstream_productos http://api-productos:3002;
        proxy_pass $upstream_productos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/inventario {
        set $upstream_inventario http://api-inventario:3003;
        proxy_pass $upstream_inventario;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/carrito {
        set $upstream_carrito http://api-carrito:3004;
        proxy_pass $upstream_carrito;
