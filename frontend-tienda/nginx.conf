server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno (Docker / Kubernetes se unificará en el clúster)
    resolver 127.0.0.11 kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # Enrutamiento SPA de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1. Usuarios -> 8001
    location /api/usuarios {
        set $upstream_usuarios http://api-usuarios:8001;
        proxy_pass $upstream_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Productos -> 8002
    location /api/productos {
        set $upstream_productos http://api-productos:8002;
        proxy_pass $upstream_productos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Envíos -> 8003
    location /api/envios {
