server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno exclusivo para Docker Compose
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Bloqueo explícito de rutas exclusivamente internas desde el proxy público
    location ~* ^/api/(pagos/procesar|inventario/reservar|inventario/liberar|envios/crear|.*/interno) {
        return 403 '{"exito":false,"error":{"codigo":"ACCESO_DENEGADO","mensaje":"Ruta interna no accesible desde el proxy público"}}';
        add_header Content-Type application/json;
    }

    # Enrutamiento SPA de Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1. Usuarios -> 8001
    location /api/usuarios {
        set $upstream_usuarios http://api-usuarios:8001;
        proxy_pass $upstream_usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Internal-Token "";
    }

    # 2. Productos -> 8002
    location /api/productos {
        set $upstream_productos http://api-productos:8002;
        proxy_pass $upstream_productos;
        proxy_set_header Host $host;
