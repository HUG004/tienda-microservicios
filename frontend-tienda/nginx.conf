    }

    location /api/envios {
        set $upstream_envios http://api-envios:3007;
        proxy_pass $upstream_envios;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/resenas {
        set $upstream_resenas http://api-resenas:3008;
        proxy_pass $upstream_resenas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}