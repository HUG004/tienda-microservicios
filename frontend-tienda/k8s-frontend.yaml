apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-tienda
  labels:
    app: frontend-tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-tienda
  template:
    metadata:
      labels:
        app: frontend-tienda
    spec:
      containers:
        - name: frontend-tienda
          image: frontend-tienda:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-tienda-service
spec:
  type: NodePort
  selector:
    app: frontend-tienda
  ports:
    - protocol: TCP
      port: 4200
      targetPort: 4200