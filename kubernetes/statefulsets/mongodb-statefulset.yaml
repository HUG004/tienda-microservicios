apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: tienda
  labels:
    app: mongodb

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: mongodb
          image: mongo:8
          imagePullPolicy: IfNotPresent

          ports:
            - name: mongodb
              containerPort: 27017

          envFrom:
            - configMapRef:
                name: tienda-database-config

            - secretRef:
                name: mongodb-secret

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

            - name: mongodb-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  mongosh --quiet \
                    --host 127.0.0.1 \
                    --username "$MONGO_INITDB_ROOT_USERNAME" \
                    --password "$MONGO_INITDB_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  mongosh --quiet \
                    --host 127.0.0.1 \
                    --username "$MONGO_APP_USER" \
                    --password "$MONGO_APP_PASSWORD" \
                    --authenticationDatabase "$MONGO_DB" \
                    "$MONGO_DB" \
                    --eval 'if (db.adminCommand({ping: 1}).ok !== 1) quit(1)'
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc

        - name: mongodb-init
          configMap:
            name: mongodb-init
            defaultMode: 0444