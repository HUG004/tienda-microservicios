apiVersion: v1
data:
  01-init.js: "const nombreDB = process.env.MONGO_DB;\r\nconst usuario = process.env.MONGO_APP_USER;\r\nconst
    password = process.env.MONGO_APP_PASSWORD;\r\n\r\nif (!nombreDB || !usuario ||
    !password) {\r\n    throw new Error(\"Variables de MongoDB incompletas\");\r\n}\r\n\r\nconst
    tiendaDB = db.getSiblingDB(nombreDB);\r\n\r\ntiendaDB.createUser({\r\n    user:
    usuario,\r\n    pwd: password,\r\n    roles: [\r\n        {\r\n            role:
    \"readWrite\",\r\n            db: nombreDB\r\n        }\r\n    ]\r\n});\r\n\r\ntiendaDB.createCollection(\"resenas\",
    {\r\n    validator: {\r\n        $jsonSchema: {\r\n            bsonType: \"object\",\r\n
    \           required: [\r\n                \"producto_id\",\r\n                \"usuario_id\",\r\n
    \               \"calificacion\",\r\n                \"comentario\",\r\n                \"creado_en\"\r\n
    \           ],\r\n            properties: {\r\n                producto_id: {\r\n
    \                   bsonType: [\"int\", \"long\"],\r\n                    minimum:
    1\r\n                },\r\n                usuario_id: {\r\n                    bsonType:
    [\"int\", \"long\"],\r\n                    minimum: 1\r\n                },\r\n
    \               calificacion: {\r\n                    bsonType: \"int\",\r\n
    \                   minimum: 1,\r\n                    maximum: 5\r\n                },\r\n
    \               comentario: {\r\n                    bsonType: \"string\",\r\n
    \                   minLength: 1,\r\n                    maxLength: 1000\r\n                },\r\n
    \               creado_en: {\r\n                    bsonType: \"date\"\r\n                }\r\n
    \           }\r\n        }\r\n    }\r\n});\r\n\r\ntiendaDB.resenas.createIndex({\r\n
    \   producto_id: 1\r\n});\r\n\r\ntiendaDB.resenas.createIndex(\r\n    {\r\n        producto_id:
    1,\r\n        usuario_id: 1\r\n    },\r\n    {\r\n        unique: true\r\n    }\r\n);\r\n\r\nprint(\"Base
    de datos de resenas inicializada\");"
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: tienda
