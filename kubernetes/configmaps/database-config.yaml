apiVersion: v1
kind: ConfigMap
metadata:
  name: tienda-database-config
  namespace: tienda
  labels:
    app: tienda-microservicios
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"

  POSTGRES_DB: "postgres"

  USUARIOS_DB_NAME: "usuarios_db"
  USUARIOS_DB_USER: "usuarios_app"

  PRODUCTOS_DB_NAME: "productos_db"
  PRODUCTOS_DB_USER: "productos_app"

  ENVIOS_DB_NAME: "envios_db"
  ENVIOS_DB_USER: "envios_app"

  INVENTARIO_DB_NAME: "inventario_db"
  INVENTARIO_DB_USER: "inventario_app"

  CARRITO_DB_NAME: "carrito_db"
  CARRITO_DB_USER: "carrito_app"

  PEDIDOS_DB_NAME: "pedidos_db"
  PEDIDOS_DB_USER: "pedidos_app"

  PAGOS_DB_NAME: "pagos_db"
  PAGOS_DB_USER: "pagos_app"

  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  MONGO_DB: "resenas_db"
  MONGO_APP_USER: "resenas_app"