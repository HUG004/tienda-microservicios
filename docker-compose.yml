name: tienda-microservicios

services:

  postgres:
    image: postgres:16
    container_name: tienda-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      USUARIOS_DB_NAME: ${USUARIOS_DB_NAME}
      USUARIOS_DB_USER: ${USUARIOS_DB_USER}
      USUARIOS_DB_PASSWORD: ${USUARIOS_DB_PASSWORD}

      PRODUCTOS_DB_NAME: ${PRODUCTOS_DB_NAME}
      PRODUCTOS_DB_USER: ${PRODUCTOS_DB_USER}
      PRODUCTOS_DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD}

      ENVIOS_DB_NAME: ${ENVIOS_DB_NAME}
      ENVIOS_DB_USER: ${ENVIOS_DB_USER}
      ENVIOS_DB_PASSWORD: ${ENVIOS_DB_PASSWORD}

      INVENTARIO_DB_NAME: ${INVENTARIO_DB_NAME}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}

      CARRITO_DB_NAME: ${CARRITO_DB_NAME}
      CARRITO_DB_USER: ${CARRITO_DB_USER}
      CARRITO_DB_PASSWORD: ${CARRITO_DB_PASSWORD}

      PEDIDOS_DB_NAME: ${PEDIDOS_DB_NAME}
      PEDIDOS_DB_USER: ${PEDIDOS_DB_USER}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}

      PAGOS_DB_NAME: ${PAGOS_DB_NAME}
      PAGOS_DB_USER: ${PAGOS_DB_USER}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:8
    container_name: tienda-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_DB: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"

    volumes:
      - mongodb-data:/data/db
      - ./database/mongodb:/docker-entrypoint-initdb.d:ro

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet
          --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  api-carrito:
    build: ./api-carrito
    container_name: tienda-carrito
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - CARRITO_DB_NAME=${CARRITO_DB_NAME}
      - CARRITO_DB_USER=${CARRITO_DB_USER}
      - CARRITO_DB_PASSWORD=${CARRITO_DB_PASSWORD}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - PRODUCTOS_API_URL=${PRODUCTOS_API_URL}
      - INVENTARIO_API_URL=${INVENTARIO_API_URL}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    networks:
      - red-tienda
    depends_on:
      postgres:
        condition: service_healthy

  api-envios:
    build: ./api-envios
    container_name: tienda-envios
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - ENVIOS_DB_NAME=${ENVIOS_DB_NAME}
      - ENVIOS_DB_USER=${ENVIOS_DB_USER}
      - ENVIOS_DB_PASSWORD=${ENVIOS_DB_PASSWORD}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - PEDIDOS_API_URL=${PEDIDOS_API_URL}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    networks:
      - red-tienda
    depends_on:
      postgres:
        condition: service_healthy

  api-pagos:
    build: ./api-pagos
    container_name: tienda-pagos
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      - PAGOS_DB_NAME=${PAGOS_DB_NAME}
      - PAGOS_DB_USER=${PAGOS_DB_USER}
      - PAGOS_DB_PASSWORD=${PAGOS_DB_PASSWORD}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - PEDIDOS_API_URL=${PEDIDOS_API_URL}
    networks:
      - red-tienda
    depends_on:
      postgres:
        condition: service_healthy

networks:
  red-tienda:
    name: red-tienda
    driver: bridge

volumes:
  postgres-data:
  mongodb-data: