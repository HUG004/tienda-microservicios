name: tienda-microservicios

services:
  api-usuarios:
    build:
      context: ./api-usuarios
      dockerfile: Dockerfile

    image: tienda/api-usuarios:1.0.0
    container_name: tienda-api-usuarios
    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8001"

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${USUARIOS_DB_NAME}
      DB_USER: ${USUARIOS_DB_USER}
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD}

      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS}

      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem

    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8001/ready') === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-pedidos:
    build:
      context: ./api-pedidos
      dockerfile: Dockerfile

    image: tienda/api-pedidos:1.0.0

    container_name: tienda-api-pedidos

    restart: unless-stopped

    ports:
      - "127.0.0.1:8006:8006"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${PEDIDOS_DB_NAME}
      DB_USER: ${PEDIDOS_DB_USER}
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}

      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem

      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

      USUARIOS_API_URL: ${USUARIOS_API_URL}
      PRODUCTOS_API_URL: ${PRODUCTOS_API_URL}
      ENVIOS_API_URL: ${ENVIOS_API_URL}
      INVENTARIO_API_URL: ${INVENTARIO_API_URL}
      CARRITO_API_URL: ${CARRITO_API_URL}
      PAGOS_API_URL: ${PAGOS_API_URL}

      PHP_CLI_SERVER_WORKERS: 4

    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8006/ready') === false ? 1 : 0);"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  
  postgres:
    image: postgres:16
    container_name: tienda-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      USUARIOS_DB_NAME: ${USUARIOS_DB_NAME}
      USUARIOS_DB_USER: ${USUARIOS_DB_USER}
      USUARIOS_DB_PASSWORD: ${USUARIOS_DB_PASSWORD}

      PRODUCTOS_DB_NAME: ${PRODUCTOS_DB_NAME}
      PRODUCTOS_DB_USER: ${PRODUCTOS_DB_USER}
      PRODUCTOS_DB_PASSWORD: ${PRODUCTOS_DB_PASSWORD}

      ENVIOS_DB_NAME: ${ENVIOS_DB_NAME}
      ENVIOS_DB_USER: ${ENVIOS_DB_USER}
      ENVIOS_DB_PASSWORD: ${ENVIOS_DB_PASSWORD}

      INVENTARIO_DB_NAME: ${INVENTARIO_DB_NAME}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD}

      CARRITO_DB_NAME: ${CARRITO_DB_NAME}
      CARRITO_DB_USER: ${CARRITO_DB_USER}
      CARRITO_DB_PASSWORD: ${CARRITO_DB_PASSWORD}

      PEDIDOS_DB_NAME: ${PEDIDOS_DB_NAME}
      PEDIDOS_DB_USER: ${PEDIDOS_DB_USER}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}

      PAGOS_DB_NAME: ${PAGOS_DB_NAME}
      PAGOS_DB_USER: ${PAGOS_DB_USER}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    image: mongo:8
    container_name: tienda-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_DB: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"

    volumes:
      - mongodb-data:/data/db
      - ./database/mongodb:/docker-entrypoint-initdb.d:ro

    networks:
      - red-tienda

    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet
          --host 127.0.0.1
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  red-tienda:
    name: red-tienda
    driver: bridge

volumes:
  postgres-data:
  mongodb-data: